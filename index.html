<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 비전: 실시간 사물 인식기-</title>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

    <style>
        /* 글로벌 스타일 & 세련된 그라데이션 배경 */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* 메인 타이틀 및 헤더 영역 */
        header {
            text-align: center;
            margin-bottom: 25px;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
            text-shadow: 0 4px 20px rgba(56, 189, 248, 0.15);
        }

        p {
            font-size: 1rem;
            color: #94a3b8;
            margin: 0;
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        /* 퓨처리스틱 상태창 스타일 */
        #status {
            font-weight: 600;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 14px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1), inset 0 0 10px rgba(56, 189, 248, 0.05);
            transition: all 0.5s ease;
            animation: pulse 2s infinite ease-in-out;
        }

        /* 비디오가 들어갈 메인 테크니컬 카드 */
        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 540px; 
            aspect-ratio: 4 / 3; 
            background: #020617;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 
                        0 0 30px rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 미래형 스캔 가이드 라인 데코레이션 */
        #canvas-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 24px;
            pointer-events: none;
            box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.1);
            z-index: 2;
        }

        video { display: none; } 

        /* 캔버스 화면 화면에 꽉 차게 부드러운 렌더링 */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 애니메이션 효과 정의 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.02); opacity: 1; box-shadow: 0 0 25px rgba(56, 189, 248, 0.25); }
        }
    </style>
</head>
<body>

    <header>
        <h1>📸 AI VISION DETECTOR</h1>
        <p>실시간 인공지능 객체 인식 카메라</p>
    </header>

    <div id="status">🤖 모델 로딩 중... (약 14MB)</div>

    <div id="canvas-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="display_canvas"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('display_canvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');

        let session;
        const modelWidth = 640;
        const modelHeight = 640;

        const labels = ["person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat", "traffic light", "fire hydrant", "stop sign", "parking meter", "bench", "bird", "cat", "dog", "horse", "sheep", "cow", "elephant", "bear", "zebra", "giraffe", "backpack", "umbrella", "handbag", "tie", "suitcase", "frisbee", "skis", "snowboard", "sports ball", "kite", "baseball bat", "baseball glove", "skateboard", "surfboard", "tennis racket", "bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple", "sandwich", "orange", "broccoli", "carrot", "hot dog", "pizza", "donut", "cake", "chair", "couch", "potted plant", "bed", "dining table", "toilet", "tv", "laptop", "mouse", "remote", "keyboard", "cell phone", "microwave", "oven", "toaster", "sink", "refrigerator", "book", "clock", "vase", "scissors", "teddy bear", "hair drier", "toothbrush"];

        async function startApp() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();

                statusDiv.innerText = "⚡ 그래픽 가속 장치 최적화 중...";
                statusDiv.style.borderColor = "rgba(129, 140, 248, 0.5)";
                
                session = await ort.InferenceSession.create('yolov8n.onnx', { executionProviders: ['webgl', 'wasm'] });

                statusDiv.innerText = "🎯 탐지 가동 중! 사물을 비춰보세요.";
                statusDiv.style.color = "#38bdf8";
                statusDiv.style.borderColor = "#38bdf8";
                statusDiv.style.animation = "none"; // 가동 후엔 깜빡임 중지

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                requestAnimationFrame(processFrame);
            } catch (err) {
                statusDiv.innerText = "❌ 오류: 카메라 권한을 허용해 주세요.";
                statusDiv.style.color = "#ef4444";
                statusDiv.style.borderColor = "#ef4444";
                statusDiv.style.animation = "none";
                console.error(err);
            }
        }

        async function processFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const inputTensor = preprocess(video, modelWidth, modelHeight);

                if (inputTensor) {
                    try {
                        const outputs = await session.run({ images: inputTensor });
                        const output = outputs[Object.keys(outputs)[0]];
                        postprocess(output.data, output.dims);
                    } catch (e) {
                        console.error(e);
                    }
                }
            }
            requestAnimationFrame(processFrame);
        }

        function preprocess(img, width, height) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width;
            tempCanvas.height = height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(img, 0, 0, width, height);

            const imgData = tempCtx.getImageData(0, 0, width, height);
            const data = imgData.data;

            const r = new Float32Array(width * height);
            const g = new Float32Array(width * height);
            const b = new Float32Array(width * height);

            for (let i = 0; i < data.length / 4; i++) {
                r[i] = data[i * 4] / 255.0;
                g[i] = data[i * 4 + 1] / 255.0;
                b[i] = data[i * 4 + 2] / 255.0;
            }

            const float32Data = new Float32Array(width * height * 3);
            float32Data.set(r, 0);
            float32Data.set(g, width * height);
            float32Data.set(b, width * height * 2);

            return new ort.Tensor('float32', float32Data, [1, 3, width, height]);
        }

        function postprocess(data, dims) {
            const numAttributes = dims[1];
            const numBoxes = dims[2];

            // 박스 드로잉 디자인 고도화 (네온 사이언/블루 매칭)
            for (let i = 0; i < numBoxes; i += 12) {
                let maxScore = 0;
                let classId = -1;

                for (let c = 4; c < numAttributes; c++) {
                    const score = data[c * numBoxes + i];
                    if (score > maxScore) {
                        maxScore = score;
                        classId = c - 4;
                    }
                }

                if (maxScore > 0.45) {
                    const cx = data[0 * numBoxes + i] / modelWidth * canvas.width;
                    const cy = data[1 * numBoxes + i] / modelHeight * canvas.height;
                    const w = data[2 * numBoxes + i] / modelWidth * canvas.width;
                    const h = data[3 * numBoxes + i] / modelHeight * canvas.height;

                    const x = cx - w / 2;
                    const y = cy - h / 2;

                    // 인식 박스를 네온 사이언 테마 컬러(#06b6d4)로 변경 및 디테일 향상
                    ctx.strokeStyle = "#06b6d4";
                    ctx.lineWidth = 3;
                    ctx.shadowColor = "rgba(6, 182, 212, 0.5)";
                    ctx.shadowBlur = 10; // 박스 주변에 은은한 광채 효과
                    ctx.strokeRect(x, y, w, h);
                    
                    // 그림자 효과 초기화 (다음 드로잉에 영향 없도록)
                    ctx.shadowBlur = 0; 

                    // 라벨 배경 박스
                    ctx.fillStyle = "#06b6d4";
                    const text = `${labels[classId].toUpperCase()} [${Math.round(maxScore * 100)}%]`;
                    ctx.font = "bold 12px monospace"; // 개발자 느낌의 고정폭 글꼴 지정
                    const textWidth = ctx.measureText(text).width;
                    
                    // 모서리가 살짝 둥근 라벨 배경 만들기
                    ctx.beginPath();
                    ctx.roundRect(x - 1.5, y - 24, textWidth + 14, 22, [4, 4, 0, 0]);
                    ctx.fill();

                    // 라벨 텍스트
                    ctx.fillStyle = "#ffffff";
                    ctx.fillText(text, x + 6, y - 9);
                }
            }
        }

        window.onload = startApp;
    </script>
</body>
</html>
